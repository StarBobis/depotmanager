[package]
name = "depotmanager"
version = "0.1.0"
description = "Steam depot version manager & downloader"
authors = ["you"]
edition = "2021"
default-run = "depotmanager"

[lib]
name = "depotmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "smoke"
path = "src/bin/smoke.rs"

[[bin]]
name = "smoke2"
path = "src/bin/smoke2.rs"

[[bin]]
name = "smoke3"
path = "src/bin/smoke3.rs"

[[bin]]
name = "smoke4"
path = "src/bin/smoke4.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.13"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
prost = "0.13"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream", "json"] }
rsa = "0.9"
sha1 = "0.10"
sha2 = "0.10"
aes = "0.8"
cbc = "0.1"
base64 = "0.22"
crc32fast = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
zstd = "0.13"
adler2 = "2"
thiserror = "2"
anyhow = "1"
hex = "0.4"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "local-offset"] }
dashmap = "6"
parking_lot = "0.12"
url = "2"
regex = "1"
log = "0.4"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
